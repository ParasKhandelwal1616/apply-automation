channel_title: "SDE Premium Referrals 2.O"  # capital letter O, as shown in Telegram
# Only consider Telegram posts from the last N hours (0 = no limit).
max_post_age_hours: 336   # 14 days (2 weeks)
# Telegram: skip posts whose minimum required experience is above this
telegram_max_experience_years: 4
# Keep posts whose date could not be read (true) or drop them (false).
keep_undated_posts: true
poll_interval_seconds: 90
dry_run_default: true
extract_limit: 10
min_text_chars: 80
screenshot_dir: data/screenshots
database_path: data/applications.db
chrome_profile_dir: data/chrome-profile
auto_send_email: true
auto_submit_forms: true
auto_submit_careers: true
auto_submit_boards: true
board_search_limit: 8
board_poll_interval_seconds: 1800
min_ctc_lpa: 6.0
min_salary_usd: 7000
# Skip listed monthly pay at or below this (₹/month). Unlisted pay is still allowed.
min_monthly_inr: 40000
board_cities:
  - bengaluru
  - hyderabad
  - chennai
  - gurugram
  - mumbai
  - pune
  - noida
# Prefer BLR/HYD/CHN; other metros allowed for strong companies / pan-India posts (see relevance.location loosen).
# Naukri searches (each runs once per city in board_cities)
board_queries:
  - ai ml engineer
  - backend engineer python
  - python developer
  - fastapi developer
  - ai engineer
  - genai engineer
  - llm engineer
  - machine learning engineer
  - sde 1
  - software engineer fresher
  - full stack developer react node
  - agentic ai engineer
  - data engineer
  - research engineer

# --- Job boards: pacing and limits ---
board_cards_per_search: 3      # cards taken from each query/city page
board_max_experience_years: 4  # Naukri: skip jobs whose minimum required experience is above this (1-4 yrs ok)
board_batch_size: 5            # max applications per run
board_gap_seconds_min: 30      # random wait between applications
board_gap_seconds_max: 120

# --- Naukri ---
naukri_daily_limit: 30
naukri_experience: 1           # URL filter (fresher/1 yr); locally we reject min required experience > 4 yrs
naukri_job_age_days: 1         # posted in the last day...
naukri_job_age_fallback_days: 3  # ...or last 3 days if a search returns nothing
naukri_ctc_filters: ["6to10", "10to15", "15to25", "25to50"]
naukri_company_posted_only: true   # jobPostType=1
naukri_sort_by_date: true          # sort=f
naukri_profile_touch: false        # daily headline re-save (uses profile.yaml naukri_headline)

# --- Wellfound ---
wellfound_daily_limit: 15
wellfound_roles: [backend-engineer, machine-learning-engineer, full-stack-engineer, software-engineer]
wellfound_include_remote_india: true
wellfound_min_lpa: 8           # jobs with no salary listed are still included
wellfound_min_stage: series a
wellfound_size_min: 11
wellfound_size_max: 500
wellfound_max_experience_years: 4   # up to 4 years
use_gemini: true
use_grok: true
telegram_start_urls:
  - https://web.telegram.org/k/
  - https://web.telegram.org/a/

