# --- Local boolean filter (Naukri and Wellfound ignore OR / NOT / quotes in search; verified 17 Oct 2026) ---
# Equivalent to: ("python" OR "fastapi" OR ...) AND ("backend" OR "ai engineer" OR ...) NOT title:(intern OR senior ...)
board_keyword_groups:
  - [python, fastapi, django, flask, node, node.js, react, pytorch, llm, genai, gen ai, machine learning, ml, ai, agentic, rag, chromadb, llama, websocket, sqlalchemy, rest api]
  - [backend, back-end, back end, full stack, fullstack, full-stack, sde, software engineer, software developer, developer, ai engineer, ml engineer, machine learning engineer, llm engineer, genai engineer, engineer, data engineer, research engineer]
board_title_excludes: [product manager, service desk, senior, sr, sr., lead, principal, staff, manager, architect, head, director, java, .net, php, android, ios, sales, qa, tester, test engineer, support, consultant, consultancy, angular, spring boot, golang, rust]
